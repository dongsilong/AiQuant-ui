name: LIVE Hardening - Frontend

on:
  push:
    branches:
      - hardening/live-production-20261014
      - feature/per-symbol-runtime-toggle-20261023
  pull_request:
    branches:
      - ai-quant-ui-dev

jobs:
  terminal-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # The current source branch has a stale lockfile; perform code validation first.
      - run: pnpm exec vitest run src/views/quant/terminal/__tests__/terminal-data.test.ts
      # The AutoImport Vite plugin generates src/types/auto-imports.d.ts during build.
      - run: pnpm run build:prod
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm run lint
      - name: Enforce committed pnpm lockfile consistency
        run: git diff --exit-code -- pnpm-lock.yaml
